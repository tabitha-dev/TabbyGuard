name: Release TabbyGuard

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v3.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Validate release version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v3.0.0"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is $PACKAGE_VERSION but requested release is $VERSION"
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify source, tests, and bundle
        run: npm run verify

      - name: Confirm committed distribution is current
        shell: bash
        run: git diff --exit-code -- dist/

      - name: Publish npm package when NPM_TOKEN is configured
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publication."
            exit 0
          fi
          npm publish --access public

      - name: Create exact and moving major tags
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" "$GITHUB_SHA"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          git push origin "refs/tags/$MAJOR" --force

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
