name: Release TabbyGuard

concurrency:
  group: tabbyguard-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v3.0.0"
        required: true
        type: string
  push:
    branches:
      - v3-release-candidate
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'tabitha-dev/TabbyGuard'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve and validate release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$DISPATCH_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="v$(node -p "require('./package.json').version")"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v3.0.0"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is $PACKAGE_VERSION but requested release is $VERSION"
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify source, tests, bundle, and bundled CLI
        run: npm run verify

      - name: Validate publishable npm tarball
        run: npm run check:package

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development dependencies
        run: npm audit --audit-level=high

      - name: Verify npm trusted-publishing CLI requirement
        shell: bash
        run: |
          npm --version
          node -e "const major = Number(process.version.slice(1).split('.')[0]); if (major < 22) process.exit(1)"
          node -e "const cp = require('node:child_process'); const version = cp.execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (version[0] < 11 || (version[0] === 11 && version[1] < 5)) { console.error('npm >= 11.5.1 is needed for trusted publishing'); process.exit(1); }"

      - name: Confirm committed distribution is current
        shell: bash
        run: git diff --exit-code -- dist/

      - name: Publish npm package with trusted publishing
        run: npm publish --access public --provenance

      - name: Create exact and moving major tags
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The release workflow can be started from a candidate branch. We
          # explicitly checked out main, so tag that verified checkout commit,
          # never GITHUB_SHA from the event that triggered the workflow.
          RELEASE_SHA="$(git rev-parse HEAD)"
          git tag "$VERSION" "$RELEASE_SHA"
          git tag -f "$MAJOR" "$RELEASE_SHA"
          git push origin "refs/tags/$VERSION"
          git push origin "refs/tags/$MAJOR" --force

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --title "TabbyGuard $VERSION" --generate-notes --verify-tag
