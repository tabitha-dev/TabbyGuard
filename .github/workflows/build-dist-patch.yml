name: Build patch distribution

on:
  push:
    branches:
      - fix/layout-contained-overflow

permissions:
  contents: write

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/layout-contained-overflow

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and rebuild distribution
        run: npm run verify

      - name: Commit rebuilt distribution
        shell: bash
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "dist/ is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild distribution for 3.0.1"
          git push
