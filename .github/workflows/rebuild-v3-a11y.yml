name: Rebuild V3 bundled accessibility

on:
  push:
    branches:
      - v3/fix-bundled-a11y
    paths:
      - ".github/workflows/rebuild-v3-a11y.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v3/fix-bundled-a11y
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed source
        run: npx prettier --write scripts/build.mjs scripts/smoke-bundle.mjs package.json

      - name: Verify source, browser fixtures, bundle, and bundled CLI
        run: npm run verify

      - name: Commit rebuilt distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.mjs scripts/smoke-bundle.mjs package.json dist/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Fix bundled accessibility scanning"
          git push origin HEAD:v3/fix-bundled-a11y
