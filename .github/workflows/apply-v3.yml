name: Apply TabbyGuard V3

on:
  push:
    branches:
      - v3/final-product
    paths:
      - ".github/workflows/apply-v3.yml"

permissions:
  contents: write

jobs:
  apply:
    name: Build and verify V3
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out V3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v3/final-product
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct V3 source overlay
        shell: bash
        run: |
          cat .v3-payload/chunk-* > /tmp/tabbyguard-v3.b64
          base64 --decode /tmp/tabbyguard-v3.b64 > /tmp/tabbyguard-v3.tar.gz
          tar -xzf /tmp/tabbyguard-v3.tar.gz -C .

      - name: Install dependencies
        run: npm ci

      - name: Format implementation
        run: npm run format

      - name: Verify V3
        run: npm run verify

      - name: Finalize V3 branch
        shell: bash
        run: |
          rm -rf .v3-payload
          rm -f .github/workflows/apply-v3.yml
          rm -f .github/workflows/release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement TabbyGuard V3 final product"
          git push origin HEAD:v3/final-product
