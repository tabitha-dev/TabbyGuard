name: Temporary page reuse verification
on:
  push:
    branches:
      - perf/reuse-readonly-page-sessions-20261026

permissions:
  contents: write

jobs:
  verify-bundle:
    if: github.repository == 'tabitha-dev/TabbyGuard' && github.ref == 'refs/heads/perf/reuse-readonly-page-sessions-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run verify
      - name: Commit validated dist and formatted code
        shell: bash
        run: |
          if ! git diff --quiet -- .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist src tests examples README.md CHANGELOG.md docs
            git diff --cached --quiet || git commit -m "Format and rebuild verified page reuse bundle"
            git push origin HEAD:perf/reuse-readonly-page-sessions-20261026
          fi
