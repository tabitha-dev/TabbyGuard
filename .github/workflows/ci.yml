name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify TabbyGuard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting, types, tests, and build
        run: npm run verify

      - name: Confirm bundled action is current
        shell: bash
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date. Run npm run build and commit the generated bundle."
            exit 1
          fi
