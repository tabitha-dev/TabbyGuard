name: Temporary snapshot verification
on:
  push:
    branches:
      - fix/viewport-snapshots-and-report-preview-20261026

permissions:
  contents: write

jobs:
  verify-snapshot:
    if: github.repository == 'tabitha-dev/TabbyGuard' && github.ref == 'refs/heads/fix/viewport-snapshots-and-report-preview-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Update patch release lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run format
      - run: npm run verify
      - run: npm run check:package
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - name: Commit formatted source and generated Action bundle
        shell: bash
        run: |
          if ! git diff --quiet -- .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist src tests examples README.md CHANGELOG.md package-lock.json
            git diff --cached --quiet || git commit -m "Format and rebuild verified snapshot capture bundle"
            git push origin HEAD:fix/viewport-snapshots-and-report-preview-20261026
          fi
