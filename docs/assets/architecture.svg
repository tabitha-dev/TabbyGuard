<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">TabbyGuard architecture</title>
  <desc id="desc">Pull request changes flow through risk planning, browser checks, evidence, deterministic findings, and GitHub reporting.</desc>
  <defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
  <rect width="1200" height="690" rx="28" fill="#f8fafc"/>
  <text x="60" y="70" font-family="ui-sans-serif,system-ui" font-size="38" font-weight="800" fill="#111827">How TabbyGuard decides what deserves a finding</text>
  <g font-family="ui-sans-serif,system-ui" text-anchor="middle">
    <rect x="70" y="130" width="240" height="110" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="190" y="175" font-size="22" font-weight="700" fill="#111827">Pull Request</text><text x="190" y="207" font-size="17" fill="#64748b">files + bounded diff</text>
    <rect x="365" y="130" width="240" height="110" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="485" y="175" font-size="22" font-weight="700" fill="#111827">Risk Planner</text><text x="485" y="207" font-size="17" fill="#64748b">deterministic first</text>
    <rect x="660" y="130" width="240" height="110" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="780" y="175" font-size="22" font-weight="700" fill="#111827">Browser Runner</text><text x="780" y="207" font-size="17" fill="#64748b">Playwright + Axe</text>
    <rect x="955" y="130" width="180" height="110" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1045" y="175" font-size="22" font-weight="700" fill="#111827">Evidence</text><text x="1045" y="207" font-size="17" fill="#64748b">trace · log · shot</text>
    <path d="M310 185h45M605 185h45M900 185h45" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><path d="m348 174 14 11-14 11m295-22 14 11-14 11m295-22 14 11-14 11" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="210" y="330" width="260" height="120" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="340" y="372" font-size="23" font-weight="800" fill="#4c1d95">Check Status</text><text x="340" y="405" font-size="17" fill="#5b21b6">passed · failed · skipped</text><text x="340" y="430" font-size="17" fill="#5b21b6">inconclusive</text>
    <rect x="570" y="330" width="260" height="120" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="700" y="372" font-size="23" font-weight="800" fill="#1e3a8a">Deterministic Findings</text><text x="700" y="405" font-size="17" fill="#1e40af">only failed evidence</text><text x="700" y="430" font-size="17" fill="#1e40af">becomes a defect</text>
    <path d="M1045 240v80H700v0" fill="none" stroke="#64748b" stroke-width="4"/><path d="m688 311 12 10 12-10" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <rect x="100" y="535" width="290" height="100" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="245" y="578" font-size="21" font-weight="700" fill="#111827">PR Review</text><text x="245" y="607" font-size="16" fill="#64748b">scannable findings</text>
    <rect x="455" y="535" width="290" height="100" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="578" font-size="21" font-weight="700" fill="#111827">Step Summary</text><text x="600" y="607" font-size="16" fill="#64748b">CI-native overview</text>
    <rect x="810" y="535" width="290" height="100" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="955" y="578" font-size="21" font-weight="700" fill="#111827">Evidence Artifact</text><text x="955" y="607" font-size="16" fill="#64748b">logs · screenshots · traces</text>
    <path d="M700 450v42H245v33M700 450v75M700 492h255v33" fill="none" stroke="url(#head)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
