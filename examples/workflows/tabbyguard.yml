name: TabbyGuard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Run TabbyGuard
        id: tabbyguard
        uses: tabitha-dev/TabbyGuard@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preview-url: ${{ vars.PREVIEW_URL }}
          fail-on-severity: high
          screenshot-mode: all

      - name: Print result
        run: |
          echo "Result: ${{ steps.tabbyguard.outputs.result }}"
          echo "Visual report artifact: ${{ steps.tabbyguard.outputs.artifact-url }}"
